# On a version tag (v0.1.0): runs the tests, then builds the release files and publishes a GitHub release (never a
# draft; notes are the tag's CHANGELOG.md section; a rerun updates the release) with
#   sf-mod-build.<version>.nupkg                 the dotnet tool (dotnet tool install --global sf-mod-build --add-source <folder>)
#   sf-mod-build-<version>-win-x64.zip           the self-contained Windows program (no .NET runtime needed to run it)
#   sf-mod-build-template-<version>.zip          the dotnet new sfmod template (dotnet new install <unzipped folder>)
#   SHA256SUMS                                   sha256 of the three files above
#   <file>.sha256                                one per file above: "<sha256>  <file>" and an LF
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore sf-mod-build.sln --locked-mode
      - run: dotnet test sf-mod-build.sln -c Release --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: The tag matches the project's version
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          $version = ([xml](Get-Content src/SfModBuild/SfModBuild.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $version) { throw "tag $env:GITHUB_REF_NAME doesn't match <Version>$version</Version> in src/SfModBuild/SfModBuild.csproj" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The dotnet tool package
        run: dotnet pack src/SfModBuild -c Release -o out
      - name: The self-contained Windows program
        run: |
          dotnet publish src/SfModBuild -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
          Copy-Item README.md, AGENTS.md, CHANGELOG.md, PRIVACY.md, LICENSE publish/win-x64/
          Compress-Archive -Path publish/win-x64/* -DestinationPath "out/sf-mod-build-$env:VERSION-win-x64.zip"
      - name: The template
        run: |
          # on Windows the * takes the dot folders too (.template.config, .gitignore); the checkout has no build output
          Compress-Archive -Path templates/sfmod/* -DestinationPath "out/sf-mod-build-template-$env:VERSION.zip"
      - name: Checksums
        working-directory: out
        run: |
          # LF line endings, a final LF and no BOM, so `sha256sum -c SHA256SUMS` works on Linux and in Git Bash
          # (Set-Content writes CRLF on Windows, and sha256sum then looks for names ending in a carriage return)
          $lines = Get-ChildItem -File | Where-Object Name -ne SHA256SUMS | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          if (-not $lines) { throw "There are no release files in out to checksum. Fix: check the publish, zip and template steps above." }
          $text = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'SHA256SUMS'), $text, [Text.UTF8Encoding]::new($false))
          Get-Content SHA256SUMS
          # and one <file>.sha256 beside each file (the same line, LF, no BOM), for tools that check one download
          foreach ($line in $lines) {
            $name = $line.Substring(66)
            [IO.File]::WriteAllText((Join-Path (Get-Location) "$name.sha256"), "$line`n", [Text.UTF8Encoding]::new($false))
          }
      - name: Check the checksums
        working-directory: out
        shell: bash
        run: |
          sha256sum -c SHA256SUMS
          for f in *.sha256; do sha256sum -c "$f"; done
          test "$(ls *.sha256 | wc -l)" -eq "$(wc -l < SHA256SUMS)"
      - name: Release notes from CHANGELOG.md
        run: |
          $section = @()
          $on = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') { $on = ($line -match ('^## ' + [regex]::Escape($env:VERSION) + '( |$)')); continue }
            if ($on) { $section += $line }
          }
          $text = ($section -join "`n").Trim()
          if (-not $text) { throw "CHANGELOG.md has no section for $env:VERSION" }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), $text + "`n", [Text.UTF8Encoding]::new($false))
      - name: Publish the GitHub release (safe to rerun)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem out -File).FullName
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" $files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            gh release edit "$env:GITHUB_REF_NAME" --notes-file release-notes.md --draft=false
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } else {
            gh release create "$env:GITHUB_REF_NAME" $files --title "sf-mod-build $env:VERSION" --notes-file release-notes.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
